name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un sistema roto en una plataforma no cancela la otra: las dos dan su veredicto.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Las dos menores se validan en las dos plataformas a propósito. El entorno de
        # trabajo es Windows con 3.13; la CI solo veía 3.12 en Linux. Ninguna se pierde.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"

      # `python`, nunca `python3`: en los runners de Windows no existe `python3`.
      - name: Validate structure, routes and delivery receipts
        run: python scripts/check-repo.py

      - name: Test the repository validator
        run: python scripts/test-check-repo.py

      - name: Test skill versioning
        run: python scripts/test-version-skill.py

      - name: Test the documentation inventory
        run: python src/document-management-software/scripts/test-doc-inventory.py

      - name: Test the ADR contract gate
        run: python src/adr-software/scripts/test-adr.py

      - name: Test the Go verification gate
        run: python src/go-testing-and-verification/scripts/test-verify-go.py

      - name: Test the TypeScript verification gate
        run: python src/typescript-testing-and-verification/scripts/test-verify-ts.py

      - name: Test the JavaScript verification gate
        run: python src/javascript-testing-and-verification/scripts/test-verify-js.py

      - name: Test the Python verification gate
        run: python src/python-testing-and-verification/scripts/test-verify-python.py

      - name: Test the security scanner
        run: python src/security-engineering/scripts/test-security_scan.py

      - name: Test the browser preflight
        run: python src/playwright-cli-usage/scripts/test-preflight.py

      - name: Test the writing gate
        run: python src/document-redactor/scripts/test-redactor.py

      - name: Test the test-document gate
        run: python src/software-testing/scripts/test-case-check.py

      - name: Test the design-system contract gate
        run: python src/design-system-architect/scripts/test-design-system.py

      - name: Test the artifact containment gate
        run: python src/explain-html/scripts/test-check-artifact.py

      - name: Check the demo catalog artifacts
        run: >
          python src/explain-html/scripts/check-artifact.py
          docs/explain-html/demo/index.html
          docs/explain-html/demo/demo-exploracion.html
          docs/explain-html/demo/demo-explicador.html
          docs/explain-html/demo/demo-informe.html
          docs/explain-html/demo/demo-diagrama.html
          docs/explain-html/demo/demo-prototipo.html
          docs/explain-html/demo/demo-cuestionario.html
          docs/explain-html/demo/demo-editor.html
          docs/explain-html/demo/demo-presentacion.html
          docs/explain-html/demo/demo-blindspots.html
          docs/explain-html/demo/demo-entrevista.html
          docs/explain-html/demo/demo-sdd.html

      - name: Test the artifact index builder
        run: python src/explain-html/scripts/test-build-index.py

      - name: Test the quick artifact renderer
        run: python src/explain-html/scripts/test-render-quick.py

      - name: Test the generic SDD document scanner
        run: python src/explain-html/scripts/test-sdd_scan.py

      - name: Test the SDD artifact renderer
        run: python src/explain-html/scripts/test-render-sdd.py

      - name: Test the artifact lifecycle
        run: python src/explain-html/scripts/test-lifecycle.py

      - name: Test the project-token extractor
        run: python src/explain-html/scripts/test-tokens-from-project.py

      - name: Test the code highlighter
        run: python src/explain-html/scripts/test-highlight.py
