name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.x"

      - name: Validate structure, routes and delivery receipts
        run: python3 scripts/check-repo.py

      - name: Test the repository validator
        run: python3 scripts/test-check-repo.py

      - name: Test skill versioning
        run: python3 scripts/test-version-skill.py

      - name: Test the documentation inventory
        run: python3 src/document-management-software/scripts/test-doc-inventory.py

      - name: Test the Go verification gate
        run: python3 src/go-testing-and-verification/scripts/test-verify-go.py

      - name: Test the TypeScript verification gate
        run: python3 src/typescript-testing-and-verification/scripts/test-verify-ts.py

      - name: Test the JavaScript verification gate
        run: python3 src/javascript-testing-and-verification/scripts/test-verify-js.py

      - name: Test the security scanner
        run: python3 src/security-engineering/scripts/test-security_scan.py
