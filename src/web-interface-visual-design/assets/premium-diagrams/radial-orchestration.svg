<svg class="pd pd-rd" xmlns="http://www.w3.org/2000/svg" viewBox="125.0 164.0 1275.0 688.0" width="1275" height="688" role="img"><title>Arquitectura radial de orquestación</title><desc>Orquestador central que delega en seis servicios —verify, review, docs, ui, tasks-agent y explore— y cierra el trabajo en un único plano de control. Cada servicio se detalla en una tarjeta con su función y su alcance.</desc><style>.pd-rd,.pd-rd[data-surface=dark],.pd-rd.surface-dark{--panel:#111f34;--panel-end:#0b1526;--blue-1:#53d5ff;--blue-2:#138bd5;--blue-3:#0a4e99;--connector:#3d536e;--connector-dot:#1d95da;--dot-halo:#071424;--connector-end:#6aa9d0;--hub:#071121;--hub-edge:#273b52;--track:#102d48;--tick:#b7eaff;--core:#0d1b2d;--core-edge:#1d344e;--core-dash:#0c5a90;--card-edge:#26374d;--icon-bg:#0b1a2d;--icon-edge:#223b56;--icon:#45c5f5;--icon-2:#42bffa;--badge:#15273d;--badge-edge:#29425d;--card-active:#26baff;--badge-active:#154c6b;--badge-active-edge:#2faee9;--pill:url(#rd-electric);--hub-text:#f1f8ff;--hub-sub:#9db4ca;--pill-text:#ffffff;--hub-note:#8fa8c0;--title:#f0f6ff;--sub:#9ab5cd;--desc:#7893ae;--badge-text:#7a9ab4;--badge-active-text:#75d7ff;--kicker:#61c9f6;--shadow:#020711;--shadow-alpha:.6}.pd-rd[data-surface=light],.pd-rd.surface-light{--panel:#ffffff;--panel-end:#e8eff6;--blue-1:#3db5ec;--blue-2:#0f7fc7;--blue-3:#0a4e8c;--connector:#7c97af;--connector-dot:#0f7fc7;--dot-halo:#ffffff;--connector-end:#7c97af;--hub:#ffffff;--hub-edge:#c3d2e0;--track:#d7e2ec;--tick:#ffffff;--core:#e9f0f7;--core-edge:#c3d2e0;--core-dash:#7fafcf;--card-edge:#c3d2e0;--icon-bg:#e9f0f7;--icon-edge:#c3d2e0;--icon:#0f7fc7;--icon-2:#0f7fc7;--badge:#e3edf7;--badge-edge:#c3d2e0;--card-active:#0f7fc7;--badge-active:#e3edf7;--badge-active-edge:#0f7fc7;--pill:#0a4e8c;--hub-text:#0b1b2b;--hub-sub:#47647e;--pill-text:#ffffff;--hub-note:#4c6884;--title:#0b1b2b;--sub:#47647e;--desc:#4c6884;--badge-text:#4c6884;--badge-active-text:#0b6fa9;--kicker:#0b6fa9;--shadow:#14304d;--shadow-alpha:.18}@media (pref