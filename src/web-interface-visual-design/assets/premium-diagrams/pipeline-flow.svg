<svg class="pd pd-pf" xmlns="http://www.w3.org/2000/svg" width="1312" height="499" viewBox="29.0 279.0 1312.0 499.0" role="img"><title>Pipeline de cinco etapas en flujo continuo</title><desc>Cadena captura, normaliza, ejecuta, verifica y publica, con los nodos sobre una onda continua que muestra el recorrido de la entrada a la salida y el detalle de cada etapa.</desc><style>.pd-pf,.pd-pf[data-surface=dark],.pd-pf.surface-dark{--panel:#14253a;--panel-end:#0c1729;--blue-1:#57d5ff;--blue-2:#168bd5;--blue-3:#075397;--lime-1:#e8ff79;--lime-2:#b8dc24;--ribbon:#123451;--pulse:#9be8ff;--node:#0b1728;--node-edge:#275d84;--node-ring:#45b9ec;--connector:#3e607d;--border:#293c55;--num:#d8f5ff;--text-1:#f3f8ff;--text-2:#a6c0d6;--text-3:#6e92af;--shadow:#01050e;--shadow-alpha:.55}.pd-pf[data-surface=light],.pd-pf.surface-light{--panel:#ffffff;--panel-end:#e9f0f7;--blue-1:#3db5ec;--blue-2:#0f7fc7;--blue-3:#0a4e8c;--lime-1:#c6e23b;--lime-2:#8fb312;--ribbon:#d7e2ec;--pulse:#2e9bd6;--node:#ffffff;--node-edge:#b9cbdb;--node-ring:#0f7fc7;--connector:#7c97af;--border:#c3d2e0;--num:#0b1b2b;--text-1:#0b1b2b;--text-2:#47647e;--text-3:#4c6884;--shadow:#14304d;--shadow-alpha:.18}@media (prefers-color-scheme:light){.pd-pf{--panel:#ffffff;--panel-end:#e9f0f7;--blue-1:#3db5ec;--blue-2:#0f7fc7;--blue-3:#0a4e8c;--lime-1:#c6e23b;--lime-2:#8fb312;--ribbon:#d7e2ec;--pulse:#2e9bd6;--node:#ffffff;--node-edge:#b9cbdb;--node-ring:#0f7fc7;--connector:#7c97af;--border:#c3d2e0;--num:#0b1b2b;--text-1:#0b1b2b;--text-2:#47647e;--text-3:#4c6884;--shadow:#14304d;--shadow-alpha:.18}}</style><defs><linearGradient id="pf-panel" x2="1" y2="1"><stop  style="stop-color:var(--panel)"/><stop offset="1"  style="stop-color:var(--panel-end)"/></linearGradient><linearGradient id="pf-blue" x2=".1" y2=".2" x1="0" y1="0"><stop  style="stop-color:var(--blue-1)"/><stop offset=".5"  style="stop-color:var(--blue-2)"/><stop offset="1"  style="stop-color:var(--blue-3)"/></linearGradient><linearGradient id="pf-lime" x2="0" y2="1"><s