<svg class="pd pd-mp" xmlns="http://www.w3.org/2000/svg" width="1400" height="641" viewBox="5.0 175.0 1400.0 641.0" role="img"><title>Protocolo multiagente por etapas</title><desc>Cadena de client, coordinator, worker y auditor conectada por los mensajes request, delegate, evidence, verdict y response.</desc><style>.pd-mp,.pd-mp[data-surface=dark],.pd-mp.surface-dark{--panel:#14253a;--panel-end:#0c1729;--arrow:#54cafa;--border:#293c55;--node:#102c43;--node-edge:#208fc9;--lifeline:#2b4963;--msg-blue:#4fc8fb;--msg-lime:#d8ee63;--dot-halo:#0a1423;--chip:#11243a;--chip-edge:#345574;--num:#bdeaff;--text-1:#f1f8ff;--text-2:#8daac2;--chip-text:#f0f8ff;--chip-sub:#8daec7;--shadow:#01050e;--shadow-alpha:.55}.pd-mp[data-surface=light],.pd-mp.surface-light{--panel:#ffffff;--panel-end:#e9f0f7;--arrow:#0f7fc7;--border:#c3d2e0;--node:#e3edf7;--node-edge:#0f7fc7;--lifeline:#7c97af;--msg-blue:#0f7fc7;--msg-lime:#8fb312;--dot-halo:#ffffff;--chip:#f2f7fb;--chip-edge:#c3d2e0;--num:#0b1b2b;--text-1:#0b1b2b;--text-2:#47647e;--chip-text:#0b1b2b;--chip-sub:#47647e;--shadow:#14304d;--shadow-alpha:.18}@media (prefers-color-scheme:light){.pd-mp{--panel:#ffffff;--panel-end:#e9f0f7;--arrow:#0f7fc7;--border:#c3d2e0;--node:#e3edf7;--node-edge:#0f7fc7;--lifeline:#7c97af;--msg-blue:#0f7fc7;--msg-lime:#8fb312;--dot-halo:#ffffff;--chip:#f2f7fb;--chip-edge:#c3d2e0;--num:#0b1b2b;--text-1:#0b1b2b;--text-2:#47647e;--chip-text:#0b1b2b;--chip-sub:#47647e;--shadow:#14304d;--shadow-alpha:.18}}</style><defs><linearGradient id="mp-panel" x2="1" y2="1"><stop  style="stop-color:var(--panel)"/><stop offset="1"  style="stop-color:var(--panel-end)"/></linearGradient><filter id="mp-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="13"  style="flood-color:var(--shadow);flood-opacity:var(--shadow-alpha)"/></filter><marker id="mp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke-width="1.7"  s