r(--chip-text)">REQUEST</text><text x="355.0" y="394" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--chip-sub)">Intent + contexto</text><path d="M530 457H880" fill="none" stroke-width="3" marker-end="url(#mp-arr)"  style="stroke:var(--msg-lime)"/><circle cx="530" cy="457" r="5" stroke-width="2"  style="fill:var(--msg-lime);stroke:var(--dot-halo)"/><circle cx="880" cy="457" r="5" stroke-width="2"  style="fill:var(--msg-lime);stroke:var(--dot-halo)"/><rect x="594.0" y="408" width="222" height="43" rx="13" stroke-width="1"  style="fill:var(--chip);stroke:var(--chip-edge)"/><text x="705.0" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" style="fill:var(--chip-text)">DELEGATE</text><text x="705.0" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--chip-sub)">Scope + tools</text><path d="M880 544H1230" fill="none" stroke-width="3" marker-end="url(#mp-arr)"  style="stroke:var(--msg-blue)"/><circle cx="880" cy="544" r="5" stroke-width="2"  style="fill:var(--msg-blue);stroke:var(--dot-halo)"/><circle cx="1230" cy="544" r="5" stroke-width="2"  style="fill:var(--msg-blue);stroke:var(--dot-halo)"/><rect x="944.0" y="495" width="222" height="43" rx="13" stroke-width="1"  style="fill:var(--chip);stroke:var(--chip-edge)"/><text x="1055.0" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" style="fill:var(--chip-text)">EVIDENCE</text><text x="1055.0" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--chip-sub)">Checks + output</text><path d="M1230 631H530" fill="none" stroke-width="3"  style="stroke:var(--msg-lime)"/><circle cx="1230" cy="631" r="5" stroke-width="2"  style="fill:var(--msg-lime);stroke:var(--dot-halo)"/><circle cx="530" cy="631" r="5" stroke-width="2"  style="fill:var(--msg-lime);stroke:var(--dot-halo)"/><rect x="769.0" y="582" width="222" height="43" rx="13" stroke-width="1"  style="fill:var(--chip);stroke:var(--chip-edge)"/><text x="880.0" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" style="fill:var(--chip-text)">VERDICT</text><text x="880.0" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--chip-sub)">PASS / FAIL</text><path d="M530 718H180" fill="none" stroke-width="3"  style="stroke:var(--msg-blue)"/><circle cx="530" cy="718" r="5" stroke-width="2"  style="fill:var(--msg-blue);stroke:var(--dot-halo)"/><circle cx="180" cy="718" r="5" stroke-width="2"  style="fill:var(--msg-blue);stroke:var(--dot-halo)"/><rect x="244.0" y="669" width="222" height="43" rx="13" stroke-width="1"  style="fill:var(--chip);stroke:var(--chip-edge)"/><text x="355.0" y="696" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" style="fill:var(--chip-text)">RESPONSE</text><text x="355.0" y="742" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--chip-sub)">Resultado final</text></svg>
