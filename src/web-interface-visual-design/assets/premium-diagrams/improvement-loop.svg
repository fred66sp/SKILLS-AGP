l:var(--text-2)">Decisiones y ADR</text><circle cx="720" cy="485" r="103" stroke-width="3" filter="url(#il-shadow)"  style="fill:var(--hub);stroke:var(--hub-edge)"/><circle cx="720" cy="485" r="83" fill="none" stroke-width="3"  style="stroke:var(--hub-ring)"/><text x="720" y="476" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="850" text-anchor="middle" style="fill:var(--hub-text)">ITERATE</text><text x="720" y="506" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" style="fill:var(--hub-sub)">evidence first</text><rect x="645" y="532" width="150" height="30" rx="15" stroke-width="1.5"  style="fill:var(--badge);stroke:var(--badge-edge)"/><text x="720" y="553" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle" style="fill:var(--lime-ink)">CONTINUOUS</text></svg>
