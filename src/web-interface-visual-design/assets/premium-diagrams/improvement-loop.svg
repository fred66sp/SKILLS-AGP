<svg class="pd pd-il" xmlns="http://www.w3.org/2000/svg" width="1005" height="482" viewBox="210.0 245.0 1005.0 482.0" role="img"><title>Bucle de mejora continua de cuatro fases</title><desc>Ciclo cerrado de plan, build, verify y learn alrededor de un núcleo de iteración guiado por evidencia, con una tarjeta por fase.</desc><style>.pd-il,.pd-il[data-surface=dark],.pd-il.surface-dark{--panel:#14253a;--panel-end:#0c1729;--blue-1:#57d5ff;--blue-2:#168bd5;--blue-3:#075397;--lime-1:#e8ff79;--lime-2:#b8dc24;--arc:#102b45;--pulse:#86dfff;--border:#293c55;--hub:#0a182a;--hub-edge:#294b66;--hub-ring:#3a8ab8;--badge:#12324d;--badge-edge:#2d678c;--accent:#5ecaf5;--text-1:#f2f9ff;--text-2:#96b2c8;--hub-text:#f1f9ff;--hub-sub:#b4d6e8;--lime-ink:#d7ef68;--shadow:#01050e;--shadow-alpha:.55}.pd-il[data-surface=light],.pd-il.surface-light{--panel:#ffffff;--panel-end:#e9f0f7;--blue-1:#3db5ec;--blue-2:#0f7fc7;--blue-3:#0a4e8c;--lime-1:#c6e23b;--lime-2:#8fb312;--arc:#d7e2ec;--pulse:#2e9bd6;--border:#c3d2e0;--hub:#ffffff;--hub-edge:#b9cbdb;--hub-ring:#b9cbdb;--badge:#e3edf7;--badge-edge:#c3d2e0;--accent:#0b6fa9;--text-1:#0b1b2b;--text-2:#47647e;--hub-text:#0b1b2b;--hub-sub:#47647e;--lime-ink:#557000;--shadow:#14304d;--shadow-alpha:.18}@media (prefers-color-scheme:light){.pd-il{--panel:#ffffff;--panel-end:#e9f0f7;--blue-1:#3db5ec;--blue-2:#0f7fc7;--blue-3:#0a4e8c;--lime-1:#c6e23b;--lime-2:#8fb312;--arc:#d7e2ec;--pulse:#2e9bd6;--border:#c3d2e0;--hub:#ffffff;--hub-edge:#b9cbdb;--hub-ring:#b9cbdb;--badge:#e3edf7;--badge-edge:#c3d2e0;--accent:#0b6fa9;--text-1:#0b1b2b;--text-2:#47647e;--hub-text:#0b1b2b;--hub-sub:#47647e;--lime-ink:#557000;--shadow:#14304d;--shadow-alpha:.18}}</style><defs><linearGradient id="il-panel" x2="1" y2="1"><stop  style="stop-color:var(--panel)"/><stop offset="1"  style="stop-color:var(--panel-end)"/></linearGradient><linearGradient id="il-blue" x2=".1" y2=".2" x1="0" y1="0"><stop  style="stop-color:var(--blue-1)"/><stop offset=".5"  style="stop-color:var(--blue-2)"/>