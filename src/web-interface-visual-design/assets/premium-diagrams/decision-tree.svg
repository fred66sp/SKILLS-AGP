<svg class="pd pd-dt" xmlns="http://www.w3.org/2000/svg" width="1200" height="633" viewBox="120.0 171.0 1200.0 633.0" role="img"><title>Árbol de decisión de un motor de políticas</title><desc>Recorrido de una petición desde la entrada hasta el resultado: comprueba autorización y validación y ramifica hacia rechazo, revisión humana o aprobación.</desc><style>.pd-dt,.pd-dt[data-surface=dark],.pd-dt.surface-dark{--panel:#14253a;--panel-end:#0c1729;--lime-1:#e8ff79;--lime-2:#b8dc24;--connector:#3e5875;--dot:#1c94cf;--border:#293c55;--diamond:#102c45;--diamond-edge:#35b3e8;--orange:#e3a65d;--badge:#172d44;--badge-edge:#33516c;--blue-accent:#51bfe9;--diamond-2:#122c43;--lime-edge:#c5e646;--text-1:#f2f8ff;--text-2:#f0f7ff;--text-3:#e8f8ff;--text-4:#eef9ff;--sub-1:#91adc4;--sub-2:#99b5c9;--sub-3:#9cb6c9;--diamond-text:#e7f7ff;--diamond-sub:#83a9c5;--diamond2-sub:#a2c2d2;--orange-ink:#e3a65d;--blue-ink:#51bfe9;--lime-ink:#d9ef65;--shadow:#01050e;--shadow-alpha:.55}.pd-dt[data-surface=light],.pd-dt.surface-light{--panel:#ffffff;--panel-end:#e9f0f7;--lime-1:#c6e23b;--lime-2:#8fb312;--connector:#7c97af;--dot:#0f7fc7;--border:#c3d2e0;--diamond:#e9f0f7;--diamond-edge:#0f7fc7;--orange:#c07e2f;--badge:#e3edf7;--badge-edge:#c3d2e0;--blue-accent:#0b6fa9;--diamond-2:#e9f0f7;--lime-edge:#8fb312;--text-1:#0b1b2b;--text-2:#0b1b2b;--text-3:#0b1b2b;--text-4:#0b1b2b;--sub-1:#47647e;--sub-2:#47647e;--sub-3:#47647e;--diamond-text:#0b1b2b;--diamond-sub:#47647e;--diamond2-sub:#47647e;--orange-ink:#8f5720;--blue-ink:#0b6fa9;--lime-ink:#557000;--shadow:#14304d;--shadow-alpha:.18}@media (prefers-color-scheme:light){.pd-dt{--panel:#ffffff;--panel-end:#e9f0f7;--lime-1:#c6e23b;--lime-2:#8fb312;--connector:#7c97af;--dot:#0f7fc7;--border:#c3d2e0;--diamond:#e9f0f7;--diamond-edge:#0f7fc7;--orange:#c07e2f;--badge:#e3edf7;--badge-edge:#c3d2e0;--blue-accent:#0b6fa9;--diamond-2:#e9f0f7;--lime-edge:#8fb312;--text-1:#0b1b2b;--text-2:#0b1b2b;--text-3:#0b1b2b;--text-4:#0b1b2b;--sub-1:#47647e;--sub-2:#47647e;--sub-3:#47647e;--diamond-text:#0b1b2b;--diamond-sub:#47647e;--diamond2-sub:#47647e;--orange-ink:#8f5720;--blue-ink:#0b6fa9;--lime-ink:#557000;--shadow:#14304d;--shadow-alpha:.18}}</style><defs><linearGradient id="dt-panel" x2="1" y2="1"><stop  style="stop-color:var(--panel)"/><stop offset="1"  style="stop-color:var(--panel-end)"/></linearGradient><linearGradient id="dt-lime" x2="0" y2="1"><stop  style="stop-color:var(--lime-1)"/><stop offset="1"  style="stop-color:var(--lime-2)"/></linearGradient><filter id="dt-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="13"  style="flood-color:var(--shadow);flood-opacity:var(--shadow-alpha)"/></filter></defs><path d="M720 290V337" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><path d="M720 455V494" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><path d="M585 396H330V520" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><path d="M855 396H1110V520" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><path d="M720 610V661" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><circle cx="720" cy="337" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><circle cx="585" cy="396" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><circle cx="855" cy="396" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><circle cx="720" cy="494" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><circle cx="330" cy="520" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><circle cx="1110" cy="520" r="5" stroke="none" stroke-width="0"  style="fill:var(--dot)"/><rect x="565" y="211" width="310" height="80" rx="23" fill="url(#dt-panel)" stroke-width="1.5" filter="url(#dt-shadow)"  style="stroke:var(--border)"/><text x="595" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start" style="fill:var(--text-1)">INPUT / REQUEST</text><text x="595" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" style="fill:var(--sub-1)">payload · context · identity</text><path d="M720 332 L855 396 L720 460 L585 396 Z" stroke-width="3" filter="url(#dt-shadow)"  style="fill:var(--diamond);stroke:var(--diamond-edge)"/><text x="720" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" style="fill:var(--diamond-text)">¿AUTORIZADO?</text><text x="720" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--diamond-sub)">policy · scope</text><rect x="160" y="520" width="340" height="152" rx="24" fill="url(#dt-panel)" stroke-width="1.5" filter="url(#dt-shadow)"  style="stroke:var(--border)"/><rect x="160" y="520" width="7" height="152" rx="3" stroke="none" stroke-width="0"  style="fill:var(--orange)"/><text x="191" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="start" style="fill:var(--text-2)">RECHAZAR</text><text x="191" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" style="fill:var(--sub-2)">Sin permisos suficientes</text><rect x="191" y="610" width="170" height="31" rx="15" stroke-width="1.5"  style="fill:var(--badge);stroke:var(--badge-edge)"/><text x="276" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" text-anchor="middle" style="fill:var(--orange-ink)">403 · DENIED</text><rect x="940" y="520" width="340" height="152" rx="24" fill="url(#dt-panel)" stroke-width="1.5" filter="url(#dt-shadow)"  style="stroke:var(--border)"/><rect x="940" y="520" width="7" height="152" rx="3" stroke="none" stroke-width="0"  style="fill:var(--blue-accent)"/><text x="971" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="start" style="fill:var(--text-2)">REVISIÓN</text><text x="971" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" style="fill:var(--sub-2)">Requiere intervención</text><rect x="971" y="610" width="170" height="31" rx="15" stroke-width="1.5"  style="fill:var(--badge);stroke:var(--badge-edge)"/><text x="1056" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" text-anchor="middle" style="fill:var(--blue-ink)">HUMAN GATE</text><path d="M720 493 L836 552 L720 611 L604 552 Z" stroke-width="3" filter="url(#dt-shadow)"  style="fill:var(--diamond-2);stroke:var(--lime-edge)"/><text x="720" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" style="fill:var(--text-4)">¿VALIDADO?</text><text x="720" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--diamond2-sub)">schema · checks</text><rect x="563" y="661" width="314" height="103" rx="24" fill="url(#dt-panel)" stroke-width="1.5" filter="url(#dt-shadow)"  style="stroke:var(--border)"/><rect x="563" y="661" width="7" height="103" rx="3" fill="url(#dt-lime)" stroke="none" stroke-width="0" /><text x="593" y="704" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="start" style="fill:var(--text-3)">APROBAR</text><text x="593" y="733" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" style="fill:var(--sub-3)">Evidencia y publicación</text><text x="451" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" style="fill:var(--orange-ink)">NO</text><text x="972" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" style="fill:var(--blue-ink)">REVISAR</text><text x="745" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" style="fill:var(--lime-ink)">SÍ</text></svg>
