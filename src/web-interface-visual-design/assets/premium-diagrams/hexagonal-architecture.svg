nnector)"/><rect x="602.0" y="800.0" width="196" height="66" rx="17" fill="url(#hx-panel)" stroke-width="1.5" filter="url(#hx-shadow)"  style="stroke:var(--card-edge)"/><text x="700.0" y="829.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" style="fill:var(--text-1)">EVENT BUS</text><text x="700.0" y="850.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1" style="fill:var(--accent)">OUTBOUND</text><path d="M474.8 623.0 L441.9 642.0" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><rect x="307.5513627132908" y="630.0" width="196" height="66" rx="17" fill="url(#hx-panel)" stroke-width="1.5" filter="url(#hx-shadow)"  style="stroke:var(--card-edge)"/><text x="405.5513627132908" y="659.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" style="fill:var(--text-1)">WORKERS</text><text x="405.5513627132908" y="680.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1" style="fill:var(--accent)">OUTBOUND</text><path d="M474.8 363.0 L441.9 344.0" fill="none" stroke-width="3"  style="stroke:var(--connector)"/><rect x="307.55136271329087" y="290.0" width="196" height="66" rx="17" fill="url(#hx-panel)" stroke-width="1.5" filter="url(#hx-shadow)"  style="stroke:var(--card-edge)"/><text x="405.55136271329087" y="319.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" style="fill:var(--text-1)">WEB UI</text><text x="405.55136271329087" y="340.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1" style="fill:var(--accent)">INBOUND</text><rect x="1050" y="285" width="260" height="200" rx="18" stroke-width="1.5"  style="fill:var(--legend);stroke:var(--legend-edge)"/><text x="1075" y="325" font-family="Inter,Segoe UI