<svg class="pd pd-hx" xmlns="http://www.w3.org/2000/svg" width="1082" height="826" viewBox="267.6 80.0 1082.4 826.0" role="img"><title>Arquitectura hexagonal con núcleo de dominio</title><desc>Núcleo de dominio puro en el centro, rodeado por el hexágono de aplicación y seis adaptadores de entrada y salida: HTTP API, CLI, SQLite, evento, workers y web UI, con una leyenda de fronteras.</desc><style>.pd-hx,.pd-hx[data-surface=dark],.pd-hx.surface-dark{--panel:#14253a;--panel-end:#0c1729;--hex-1:#0c1b2d;--hex-2:#10243a;--hex-3:#112a44;--core:#0a1a2e;--core-circle:#0b182b;--hex-edge-1:#25415d;--hex-edge-2:#246a9d;--hex-edge-3:#3aa5d7;--lime-edge:#a7d938;--connector:#4d7895;--card-edge:#2e5879;--legend:#0e1b2d;--legend-edge:#29435d;--divider:#2d506a;--guide:#44708b;--core-title:#f0f8ff;--lime-ink:#d9f65a;--core-sub:#94afc5;--text-1:#e8f5ff;--accent:#56bde8;--legend-text:#dcecf8;--shadow:#01050e;--shadow-alpha:.55}.pd-hx[data-surface=light],.pd-hx.surface-light{--panel:#ffffff;--panel-end:#e9f0f7;--hex-1:#dce8f3;--hex-2:#e6eff7;--hex-3:#f1f6fb;--core:#ffffff;--core-circle:#ffffff;--hex-edge-1:#c3d2e0;--hex-edge-2:#7fafcf;--hex-edge-3:#3d8fc4;--lime-edge:#8fb312;--connector:#7c97af;--card-edge:#c3d2e0;--legend:#f2f7fb;--legend-edge:#c3d2e0;--divider:#c3d2e0;--guide:#7c97af;--core-title:#0b1b2b;--lime-ink:#557000;--core-sub:#47647e;--text-1:#0b1b2b;--accent:#0b6fa9;--legend-text:#0b1b2b;--shadow:#14304d;--shadow-alpha:.18}@media (prefers-color-scheme:light){.pd-hx{--panel:#ffffff;--panel-end:#e9f0f7;--hex-1:#dce8f3;--hex-2:#e6eff7;--hex-3:#f1f6fb;--core:#ffffff;--core-circle:#ffffff;--hex-edge-1:#c3d2e0;--hex-edge-2:#7fafcf;--hex-edge-3:#3d8fc4;--lime-edge:#8fb312;--connector:#7c97af;--card-edge:#c3d2e0;--legend:#f2f7fb;--legend-edge:#c3d2e0;--divider:#c3d2e0;--guide:#7c97af;--core-title:#0b1b2b;--lime-ink:#557000;--core-sub:#47647e;--text-1:#0b1b2b;--accent:#0b6fa9;--legend-text:#0b1b2b;--shadow:#14304d;--shadow-alpha:.18}}</style><defs><linearGradient id="hx-panel" x2="1" y2="1"><stop  style="stop-color:var(--panel)"/><stop offset="1"  style="stop-color:var(--panel-end)"/></linearGradient><filter id="hx-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="13"  style="flood-color:var(--shadow);flood-opacity:var(--shadow-alpha)"/></filter></defs><polygon points="972.8,335.5 972.8,650.5 700.0,808.0 427.2,650.5 427.2,335.5 700.0,178.0" stroke-width="3" filter="url(#hx-shadow)"  style="fill:var(--hex-1);stroke:var(--hex-edge-1)"/><polygon points="917.4,367.5 917.4,618.5 700.0,744.0 482.6,618.5 482.6,367.5 700.0,242.0" stroke-width="4" filter="url(#hx-shadow)"  style="fill:var(--hex-2);stroke:var(--hex-edge-2)"/><polygon points="861.9,399.5 861.9,586.5 700.0,680.0 538.1,586.5 538.1,399.5 700.0,306.0" stroke-width="4" filter="url(#hx-shadow)"  style="fill:var(--hex-3);stroke:var(--hex-edge-3)"/><polygon points="802.2,434.0 802.2,552.0 700.0,611.0 597.8,552.0 597.8,434.0 700.0,375.0" stroke-width="5" filter="url(#hx-shadow)"  style="fill:var(--core);stroke:var(--lime-edge)"/><polygon points="890.5,383.0 890.5,603.0 700.0,713.0 509.5,603.0 509.5,383.0 700.0,273.0" fill="none" stroke-opacity=".4" stroke-dasharray="5 10"  style="stroke:var(--guide)"/><polygon points="832.5,416.5 832.5,569.5 700.0,646.0 567.5,569.5 567.5,416.5 700.0,340.0" fill="none" stroke-opacity=".4" stroke-dasharray="5 10"  style="stroke:var(--guide)"/><circle cx="700" cy="493" r="76" stroke-width="3"  style="fill:var(--core-circle);stroke:var(--lime-edge)"/><text x="700" y="483" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="850" text-anchor="middle" style="fill:var(--core-title)">DOMAIN</text><text x="700" y="513" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="850" text-anchor="middle" style="fill:var(--lime-ink)">CORE</text><text x="700" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="fill:var(--core-sub)">pure