<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas en el navegador</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px; font: 15px/1.6 system-ui, -apple-system, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { margin: 0 0 18px; opacity: .75; font-size: 14px; }
  ol { padding-left: 22px; }
  li { margin: 6px 0; }
  .pass { color: #047857; }
  .fail { color: #b91c1c; }
  pre { margin: 6px 0 0; padding: 8px; border-radius: 6px; background: rgba(127, 127, 127, .16); white-space: pre-wrap; overflow-x: auto; }
  .summary { margin-top: 20px; font-weight: 600; }
</style>
</head>
<body>
<h1>Pruebas en el navegador</h1>
<p class="hint">Casos registrados con <code>test(nombre, fn)</code>. Se ejecutan al terminar la carga; recarga para repetir.</p>
<ol id="results"></ol>
<p class="summary" id="summary">Sin casos.</p>
<script>
"use strict";

// Runner mínimo: sin dependencias y sin red. Se carga después del código que
// se prueba y antes de los archivos con los casos.

const cases = [];

function test(name, body) {
  cases.push({ name, body });
}

function equal(actual, expected, message) {
  if (!deepEqual(actual, expected)) {
    fail(`${message || "equal"}: got ${show(actual)}, want ${show(expected)}`);
  }
}

function ok(value, message) {
  if (!value) {
    fail(message || `ok: got ${show(value)}`);
  }
}

function fail(message) {
  throw new Error(message);
}

function deepEqual(left, right) {
  if (Object.is(left, right)) {
    return true;
  }
  if (typeof left !== "object" || typeof right !== "object" || left === null || right === null) {
    return false;
  }
  if (Array.isArray(left) !== Array.isArray(right)) {
    return false;
  }
  const keys = Object.keys(left);
  if (keys.length !== Object.keys(right).length) {
    return false;
  }
  return keys.every((key) => Object.hasOwn(right, key) && deepEqual(left[key], right[key]));
}

function show(value) {
  try {
    return JSON.stringify(value);
  } catch {
    return String(value);
  }
}

function report() {
  const list = document.getElementById("results");
  const summary = document.getElementById("summary");
  let failed = 0;
  for (const { name, body } of cases) {
    const item = document.createElement("li");
    item.className = "pass";
    item.textContent = name;
    try {
      body();
    } catch (error) {
      failed += 1;
      item.className = "fail";
      const detail = document.createElement("pre");
      detail.textContent = error && error.stack ? error.stack : String(error);
      item.append(detail);
    }
    list.append(item);
  }
  summary.textContent = `${cases.length - failed} de ${cases.length} casos correctos`;
  summary.className = failed ? "summary fail" : "summary pass";
}

window.addEventListener("load", report, { once: true });
</script>
</body>
</html>
