<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Plantilla base de explain-html: cópiala como esqueleto del artefacto.
     Tokens, tema claro/oscuro y tipografía ya resueltos; añade las secciones
     de la familia elegida (references/artifact-patterns.md). Sin recursos
     externos: todo CSS, JS y SVG en línea. -->
<title>ASUNTO DEL ARTEFACTO</title>
<style>
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --border: #e2e1de;
  --text: #1c1b1a;
  --text-dim: #5d5b58;
  --accent: #0f766e;
  --ok: #15803d;
  --warn: #b45309;
  --err: #b91c1c;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413;
    --surface: #1e1e1d;
    --border: #333231;
    --text: #ecebea;
    --text-dim: #9d9b98;
    --accent: #2dd4bf;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 1rem/1.6 system-ui, "Segoe UI", sans-serif;
}
header {
  padding: 2.5rem 1.5rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; text-wrap: balance; }
h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; text-wrap: balance; }
p, li { max-width: 65ch; }
.lead { color: var(--text-dim); font-size: 1.05rem; margin: 0; }
main { padding: 0 1.5rem 3rem; max-width: 72rem; }
section { margin-top: 2.5rem; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; vertical-align: top; }
th { background: var(--surface); }
pre, code { font-family: var(--mono); font-size: .875rem; }
pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .75rem 1rem; overflow-x: auto; white-space: pre-wrap; }
figure { margin: 1.5rem 0; }
figcaption { color: var(--text-dim); font-size: .875rem; margin-top: .5rem; }
button {
  font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: .5rem 1rem; cursor: pointer;
}
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.copy-prompt { margin-top: 2rem; }
.copy-prompt.ok { border-color: var(--ok); color: var(--ok); }
details { border: 1px solid var(--border); border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0; }
summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  button, details { transition: border-color .15s ease; }
}
</style>
</head>
<body>
<header>
  <h1>ASUNTO DEL ARTEFACTO</h1>
  <p class="lead">Una línea con la pregunta que resuelve el artefacto y la fecha.</p>
</header>
<main>

  <!-- Añade aquí las secciones de la familia elegida. -->

  <section id="desconocidos">
    <h2>Desconocidos</h2>
    <p>Lista explícita de lo que el material fuente no permitió verificar y qué lo desbloquearía. Sin relleno.</p>
  </section>

  <!-- Solo en artefactos con retorno: editor, cuestionario, prototipo afinado. -->
  <section class="copy-prompt">
    <button type="button" id="copy-prompt">Copiar como prompt</button>
  </section>

</main>
<script>
// Sustituye este marcador por la construcción del texto de retorno con el
// estado actual del artefacto (valores de controles, selección, resultado).
document.getElementById("copy-prompt").addEventListener("click", async function () {
  var text = "Construye aquí el texto a copiar: listo para pegar en la conversación.";
  try {
    await navigator.clipboard.writeText(text);
    this.textContent = "Copiado";
    this.classList.add("ok");
    setTimeout(function (b) { b.textContent = "Copiar como prompt"; b.classList.remove("ok"); }, 1000, this);
  } catch (e) {
    this.textContent = "No se pudo copiar: copia el texto a mano";
  }
});
</script>
</body>
</html>
