<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M7 13h18' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M12 19l3 3 5-5' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var t = localStorage.getItem("explain-html:theme");
    if (!t && window.matchMedia) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t || "light");
  } catch (e) {}
  document.documentElement.classList.add("js");
})();
</script>
<!-- Plantilla base de explain-html: el esqueleto mínimo. Para generar, copia la
     plantilla de la familia elegida (plantilla-exploracion.html, plantilla-informe.html
     y así hasta las diez) y usa esta solo si el encargo no encaja en ninguna.
     Tokens, tema claro/oscuro y tipografía ya resueltos; sin recursos externos:
     todo CSS, JS y SVG en línea. -->
<title>ASUNTO DEL ARTEFACTO</title>
<style>
:root{
  color-scheme:light;
  --bg:#f8fafc; --surface:#ffffff; --sunken:#f1f5f9;
  --text:#0f172a; --muted:#5f6b80;
  --line:#e2e8f0; --line-strong:#cbd5e1;
  --accent:#4f46e5; --accent-2:#2563eb; --accent-3:#0891b2;
  --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --terminal:#0a0f1c; --terminal-panel:#111827; --terminal-line:#1f2937; --terminal-content:#e5e7eb;
  --ok:#047857; --ok-mark:#10b981; --warn:#b45309; --warn-mark:#f59e0b; --err:#b91c1c; --err-mark:#ef4444;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
  --shadow-lg:0 20px 60px -30px rgba(15,23,42,.35);
  --radius:16px; --radius-sm:10px; --radius-inline:6px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Fira Code",Menlo,Consolas,monospace;
  --fs-display:clamp(34px,6vw,62px);
  --fs-h1:clamp(30px,4.4vw,42px);
  --fs-h2:clamp(21px,2.6vw,27px);
  --gutter:clamp(16px,4vw,40px);
  --shell:1180px;
  --sp-1:8px; --sp-2:12px; --sp-3:16px; --sp-4:24px; --sp-5:32px; --sp-6:48px; --sp-7:64px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0f1c; --surface:#111827; --sunken:#1f2937;
  --text:#e5e7eb; --muted:#94a3b8;
  --line:#334155; --line-strong:#475569;
  --accent:#818cf8; --accent-2:#93c5fd; --accent-3:#67e8f9;
  --terminal:#070b16; --terminal-panel:#111827; --terminal-line:#1f2937; --terminal-content:#e5e7eb;
  --ok:#34d399; --ok-mark:#34d399; --warn:#fbbf24; --warn-mark:#fbbf24; --err:#f87171; --err-mark:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -18px rgba(0,0,0,.8);
  --shadow-lg:0 24px 70px -34px rgba(0,0,0,.9);
}
:root{
  /* Alias del contrato de tokens: los patrones del proyecto siguen usando estos roles. */
  --border:var(--line); --border-strong:var(--line-strong);
  --text-dim:var(--muted);
  --code-bg:var(--terminal); --code-text:var(--terminal-content); --code-border:var(--terminal-line);
  --sans:var(--font); --pad:var(--gutter); --measure:68ch;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.shell{width:min(calc(100% - 2*var(--gutter)),var(--shell));margin-inline:auto}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.skip{position:absolute;left:16px;top:-64px;z-index:100;padding:10px 16px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-weight:650;font-size:14px}
.skip:focus{top:12px}
h1{margin:0;font-size:var(--fs-display);font-weight:800;line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
h2{font-size:var(--fs-h2);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:40px 0 12px;text-wrap:balance}
h3{font-size:17px;line-height:1.35;letter-spacing:-.01em;margin:0 0 6px}
p,li{max-width:74ch}
.lead{margin:18px 0 0;max-width:660px;color:var(--muted);font-size:clamp(16px,2vw,18.5px);line-height:1.6}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok-mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-mark) 22%,transparent)}
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);min-width:0}
.brand:hover{text-decoration:none}
.mark{display:block;width:32px;height:32px;border-radius:9px;overflow:hidden;box-shadow:var(--shadow);flex:none}
.mark svg{display:block;width:100%;height:100%}
.brand-text{min-width:0}
.brand-text strong{display:block;font-size:14.5px;line-height:1.2;letter-spacing:-.02em;white-space:nowrap}
.brand-text small{display:block;font-size:10.5px;line-height:1.3;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-nav{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.top-nav a,.theme{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 11px;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--muted);font:600 13px/1 var(--font);background:transparent}
.top-nav a:hover{color:var(--text);background:var(--surface);border-color:var(--line);text-decoration:none}
.theme{width:34px;padding:0;border-color:var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.theme:hover{border-color:var(--line-strong)}
.theme svg{width:16px;height:16px}
.i-sun{display:none}
:root[data-theme="dark"] .i-moon{display:none}
:root[data-theme="dark"] .i-sun{display:block}
.hero{position:relative;overflow:hidden;margin-top:0;padding:clamp(44px,7vw,86px) 0 clamp(32px,5vw,52px);border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:-45% -10% auto -10%;height:520px;background:radial-gradient(58% 60% at 18% 32%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(46% 50% at 74% 4%,color-mix(in srgb,var(--accent-2) 18%,transparent),transparent 70%),radial-gradient(40% 44% at 94% 28%,color-mix(in srgb,var(--accent-3) 14%,transparent),transparent 70%);filter:blur(8px);pointer-events:none}
.hero>.shell{position:relative}
.hero.grid-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line-strong) 1px,transparent 1px),linear-gradient(90deg,var(--line-strong) 1px,transparent 1px);background-size:56px 56px;opacity:.28;-webkit-mask-image:radial-gradient(70% 80% at 50% 10%,#000 10%,transparent 72%);mask-image:radial-gradient(70% 80% at 50% 10%,#000 10%,transparent 72%);pointer-events:none}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid transparent;border-radius:var(--radius-sm);font:650 14.5px/1.2 var(--font);cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .2s,border-color .15s,background .15s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
:root[data-theme="dark"] .btn-primary{color:#0a0f1c}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{text-decoration:none;border-color:var(--accent);color:var(--text)}
.btn svg{width:16px;height:16px;flex:none}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.tag-accent{background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent)}
.tag-ok{background:color-mix(in srgb,var(--ok-mark) 10%,transparent);border-color:color-mix(in srgb,var(--ok-mark) 32%,transparent);color:var(--ok)}
.section{margin-top:var(--sp-7)}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.section-head h2{margin:0}
.num{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font:800 13px/1 var(--font);font-variant-numeric:tabular-nums;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.note{display:flex;gap:12px;margin:20px 0;padding:14px 16px;border-left:1px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--accent-soft);font-size:14px}
.note p{margin:0;max-width:80ch}
.note strong{color:var(--text)}
.note-ok{border-left-color:var(--ok-mark);background:color-mix(in srgb,var(--ok-mark) 9%,transparent)}
.note-warn{border-left-color:var(--warn-mark);background:color-mix(in srgb,var(--warn-mark) 10%,transparent)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);margin:20px 0}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
thead th{text-align:left;padding:11px 16px;background:var(--sunken);color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 3%,transparent)}
td code,th code{font-size:12.8px}
pre,code{font-family:var(--mono)}
pre{margin:18px 0;padding:16px 18px;background:var(--terminal);color:var(--terminal-content);border:1px solid var(--terminal-line);border-radius:var(--radius);overflow-x:auto;font:400 12.9px/1.72 var(--mono);box-shadow:var(--shadow);white-space:pre-wrap}
pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
code{font-family:var(--mono);font-size:.875em;background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-inline);padding:.08em .38em}
p code,li code,td code{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-inline);padding:.08em .4em;font-size:.88em}
figure{margin:24px 0}
svg text:not([fill]){fill:currentColor}
figcaption{margin-top:8px;color:var(--muted);font-size:.875rem}
section{margin-top:40px}
details{margin:.75rem 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0;box-shadow:var(--shadow)}
summary{display:flex;gap:10px;align-items:baseline;padding:14px 16px;cursor:pointer;font-weight:650;font-size:15px;border-radius:var(--radius-sm)}
summary::marker{color:var(--accent)}
summary:focus-visible{outline-offset:-2px}
details[open] summary{border-bottom:1px solid var(--line);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm)}
button{padding:.55rem 1rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent)}
button.ok{color:var(--ok);border-color:var(--ok)}
input[type="range"]{accent-color:var(--accent)}
select{padding:.45rem .6rem}
textarea{display:block;width:100%;padding:.5rem .6rem;font:inherit;resize:vertical}
ul.tight{margin:12px 0;padding-left:20px}
ul.tight li{margin:6px 0}
.foot{border-top:1px solid var(--line);margin-top:var(--sp-7);padding:24px 0 40px;color:var(--muted);font-size:13px}
.foot-in{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:space-between}
.foot code{background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.foot a{color:var(--accent)}
.reveal{min-width:0}
@media (prefers-reduced-motion:no-preference){
  .js .reveal{opacity:0;transform:translateY(12px)}
  .js .reveal.in{opacity:1;transform:none;transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--d,0)*70ms)}
  .js .hero>.shell{animation:rise .6s ease-out both}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (max-width:640px){
  .brand-text small{display:none}
  .top-nav a{padding:0 8px;font-size:12.5px}
  table{font-size:.875rem}
  th,td{padding:.5rem .6rem}
}


.copy-prompt { margin-top: 32px; }
.copy-prompt .ok, button.ok { color: var(--ok); border-color: var(--ok); }
details { margin: .75rem 0; }
</style>
</head>
<body>
<!-- Bloque de procedencia — obligatorio; lo exige check-artifact.py.
     Rellena prompt, fecha (AAAA-MM-DD), familia y fuentes. No se renderiza
     y sobrevive a cualquier editor. Familias válidas: exploracion,
     explicador, informe, diagrama, prototipo, cuestionario, editor,
     presentacion, blindspots, entrevista. -->
<!-- procedencia: {"prompt": "", "fecha": "", "familia": "", "fuentes": []} -->
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="top">
  <div class="shell top-in">
    <a class="brand" href="index.html" aria-label="explain-html, índice de artefactos">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation"><rect width="32" height="32" rx="8" fill="#4f46e5"/><rect x="7" y="9" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M7 13h18" stroke="#ffffff" stroke-width="2"/><path d="M12 19l3 3 5-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-text"><strong>explain-html</strong><small>artefacto · artefacto</small></span>
    </a>
    <nav class="top-nav" aria-label="Navegación">
      <a href="index.html">Índice</a>
      <button class="theme" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" title="Cambiar tema">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<section class="hero grid-bg" id="portada">
  <div class="shell">
    <p class="eyebrow"><span class="dot"></span>artefacto · fecha del artefacto</p>
    <h1>ASUNTO DEL ARTEFACTO</h1>
    <p class="lead">Una línea con la pregunta que resuelve el artefacto y la fecha.</p>
  </div>
</section>
<main class="shell inner" id="contenido">

  <!-- Añade aquí las secciones de la familia elegida. -->

  <section id="desconocidos">
    <h2>Desconocidos</h2>
    <p>Lista explícita de lo que el material fuente no permitió verificar y qué lo desbloquearía. Sin relleno.</p>
  </section>

  <!-- Solo en artefactos con retorno: editor, cuestionario, prototipo afinado. -->
  <section class="copy-prompt">
    <button type="button" id="copy-prompt">Copiar como prompt</button>
  </section>

</main>
<script>
// Sustituye este marcador por la construcción del texto de retorno con el
// estado actual del artefacto (valores de controles, selección, resultado).
document.getElementById("copy-prompt").addEventListener("click", async function () {
  var text = "Construye aquí el texto a copiar: listo para pegar en la conversación.";
  try {
    await navigator.clipboard.writeText(text);
    this.textContent = "Copiado";
    this.classList.add("ok");
    setTimeout(function (b) { b.textContent = "Copiar como prompt"; b.classList.remove("ok"); }, 1000, this);
  } catch (e) {
    this.textContent = "No se pudo copiar: copia el texto a mano";
  }
});
</script>
<script>
(function () {
  var root = document.documentElement;
  var toggles = [].slice.call(document.querySelectorAll("[data-theme-toggle]"));
  function label() {
    var dark = root.getAttribute("data-theme") === "dark";
    toggles.forEach(function (toggle) {
      toggle.setAttribute("aria-label", dark ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
    });
  }
  if (toggles.length) {
    label();
    toggles.forEach(function (toggle) {
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("explain-html:theme", next); } catch (e) {}
        label();
      });
    });
  }
})();
</script>
</body>
</html>
