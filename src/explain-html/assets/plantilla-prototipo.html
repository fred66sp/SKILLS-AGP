<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Plantilla de la familia «prototipo» de explain-html.
     Cópiala para el artefacto, sustituye los marcadores y rellena la
     procedencia. Estructura: references/artifact-patterns.md. Sin recursos
     externos: todo CSS, JS y SVG en línea. -->
<title>ASUNTO DEL ARTEFACTO</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9; --surface: #ffffff; --border: #e2e1de; --text: #1c1b1a; --text-dim: #5d5b58;
  --accent: #0f766e; --accent-2: #2563eb; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  --code-bg: #0a0f1c; --code-text: #e5e7eb; --code-border: #1f2937;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Fira Code", Menlo, Consolas, monospace;
  --radius: 16px; --radius-sm: 10px; --radius-inline: 6px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px -12px rgba(15, 23, 42, .18);
  --pad: clamp(16px, 4vw, 40px);
  --measure: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1e1e1d; --border: #333231; --text: #ecebea; --text-dim: #9d9b98;
    --accent: #2dd4bf; --accent-2: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --code-bg: #070b16; --code-text: #e5e7eb; --code-border: #1f2937;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -18px rgba(0, 0, 0, .8);
  }
}
* { box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
}
header { padding: clamp(24px, 4vw, 40px) max(var(--pad), calc((100% - 72rem) / 2)) 20px; border-bottom: 1px solid var(--border); }
main { padding-bottom: 64px; }
h1 { margin: 0 0 8px; font-size: clamp(1.75rem, 3.4vw, 2.4rem); line-height: 1.12; letter-spacing: -.025em; text-wrap: balance; }
h2 { margin: 40px 0 12px; font-size: clamp(1.25rem, 2vw, 1.5rem); line-height: 1.25; letter-spacing: -.02em; text-wrap: balance; }
h3 { font-size: 1.05rem; line-height: 1.35; letter-spacing: -.01em; }
p, li { max-width: var(--measure); }
.lead { max-width: 60ch; margin: 0; color: var(--text-dim); font-size: 1.05rem; line-height: 1.6; }
section { margin-top: 40px; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
button { padding: .55rem 1rem; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--accent); }
button.ok { color: var(--ok); border-color: var(--ok); }
input[type="range"] { accent-color: var(--accent); }
select { padding: .45rem .6rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
pre {
  margin: 16px 0; padding: 16px 18px; background: var(--code-bg); color: var(--code-text);
  border: 1px solid var(--code-border); border-radius: var(--radius); overflow-x: auto;
  box-shadow: var(--shadow); white-space: pre-wrap; font: 400 .8125rem/1.7 var(--mono);
}
pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
code { font-family: var(--mono); font-size: .875em; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-inline); padding: .08em .38em; }
figure { margin: 24px 0; }
figcaption { margin-top: 8px; color: var(--text-dim); font-size: .875rem; }
table { width: 100%; border-collapse: collapse; font-size: .94rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
th, td { padding: .6rem .8rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
thead th { background: color-mix(in srgb, var(--border) 35%, var(--surface)); color: var(--text-dim); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
tbody tr:last-child td { border-bottom: 0; }
details { margin: .75rem 0; padding: .75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
summary { cursor: pointer; font-weight: 650; }
summary:focus-visible { outline-offset: -2px; }
::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
@media (max-width: 640px) {
  table { font-size: .875rem; }
  th, td { padding: .5rem .6rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}
main { width: min(calc(100% - 2 * var(--pad)), 72rem); margin-inline: auto; }

.stage { display: grid; place-items: center; min-height: 50vh; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.demo { --duration: 300ms; --scale: 1.08; --easing: cubic-bezier(.2, 0, 0, 1); display: grid; place-items: center; width: 12rem; height: 6rem; background: var(--accent); color: #ffffff; border-radius: var(--radius-sm); font-weight: 650; transition: transform var(--duration) var(--easing); }
.demo:hover, .demo:focus-visible { transform: scale(var(--scale)); }
@media (prefers-color-scheme: dark) { .demo { color: #0a0f1c; } }
.controls { display: grid; grid-template-columns: max-content 1fr; gap: 12px 16px; align-items: center; margin-top: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.controls output { font-family: var(--mono); font-size: .875rem; }
.copy-prompt { margin-top: 16px; }
</style>
</head>
<body>
<!-- Bloque de procedencia — obligatorio; lo exige check-artifact.py.
     Rellena prompt, fecha (AAAA-MM-DD), familia y fuentes. No se renderiza
     y sobrevive a cualquier editor. Familias válidas: exploracion,
     explicador, informe, diagrama, prototipo, cuestionario, editor,
     presentacion, blindspots, entrevista. -->
<!-- procedencia: {"prompt": "", "fecha": "", "familia": "", "fuentes": []} -->
<header>
  <h1>ASUNTO DEL ARTEFACTO</h1>
  <p class="lead">Qué interacción se prueba y qué debe notarse, con la fecha.</p>
</header>
<main>

  <section id="prueba">
    <h2>Zona de prueba</h2>
    <div class="stage">
      <div class="demo" tabindex="0" id="demo">Pasa el ratón o enfoca</div>
    </div>
    <div class="controls">
      <label for="duration">Duración</label>
      <input type="range" id="duration" min="100" max="900" step="50" value="300">
      <label for="scale">Escala</label>
      <input type="range" id="scale" min="1" max="1.3" step="0.02" value="1.08">
      <span>Easing</span>
      <label><input type="checkbox" id="bounce" checked> Con rebote</label>
      <span></span>
      <output id="state" aria-live="polite"></output>
    </div>
    <p class="copy-prompt"><button type="button" id="copy-prompt">Copiar como prompt</button></p>
  </section>

  <section id="desconocidos">
    <h2>Desconocidos</h2>
    <p>Qué no se pudo verificar o qué falta para validar la interacción.</p>
  </section>

</main>
<script>
(function () {
  var stageDemo = document.getElementById("demo");
  var duration = document.getElementById("duration");
  var scale = document.getElementById("scale");
  var bounce = document.getElementById("bounce");
  var state = document.getElementById("state");

  function apply() {
    var easing = bounce.checked
      ? "cubic-bezier(0.34, 1.56, 0.64, 1)"
      : "cubic-bezier(0.2, 0, 0, 1)";
    stageDemo.style.setProperty("--duration", duration.value + "ms");
    stageDemo.style.setProperty("--scale", scale.value);
    stageDemo.style.setProperty("--easing", easing);
    state.textContent = "duración " + duration.value + "ms · escala " + scale.value
      + " · " + (bounce.checked ? "con rebote" : "sin rebote");
  }

  duration.addEventListener("input", apply);
  scale.addEventListener("input", apply);
  bounce.addEventListener("change", apply);
  apply();

  document.getElementById("copy-prompt").addEventListener("click", async function () {
    var text = "Ajusta la interacción: duración " + duration.value + "ms, escala "
      + scale.value + ", easing " + (bounce.checked
        ? "cubic-bezier(0.34, 1.56, 0.64, 1)" : "cubic-bezier(0.2, 0, 0, 1)") + ".";
    try {
      await navigator.clipboard.writeText(text);
      this.textContent = "Copiado";
      this.classList.add("ok");
      setTimeout(function (b) { b.textContent = "Copiar como prompt"; b.classList.remove("ok"); }, 1000, this);
    } catch (e) {
      this.textContent = "No se pudo copiar: copia el texto a mano";
    }
  });
})();
</script>
</body>
</html>
