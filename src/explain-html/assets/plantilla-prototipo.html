<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Plantilla de la familia «prototipo» de explain-html.
     Cópiala para el artefacto, sustituye los marcadores y rellena la
     procedencia. Estructura: references/artifact-patterns.md. Sin recursos
     externos: todo CSS, JS y SVG en línea. -->
<title>ASUNTO DEL ARTEFACTO</title>
<style>
:root {
  --bg: #fafaf9; --surface: #ffffff; --border: #e2e1de; --text: #1c1b1a;
  --text-dim: #5d5b58; --accent: #0f766e; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --surface: #1e1e1d; --border: #333231; --text: #ecebea;
    --text-dim: #9d9b98; --accent: #2dd4bf; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; }
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.6 system-ui, "Segoe UI", sans-serif; }
header { padding: 2.5rem 1.5rem 1.5rem; border-bottom: 1px solid var(--border); }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; text-wrap: balance; }
h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; text-wrap: balance; }
p, li { max-width: 65ch; }
.lead { color: var(--text-dim); font-size: 1.05rem; margin: 0; }
main { padding: 0 1.5rem 3rem; max-width: 72rem; }
section { margin-top: 2.5rem; }
button { font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; place-items: center; min-height: 50vh; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
.demo { width: 12rem; height: 6rem; border-radius: 10px; background: var(--accent);
  color: #ffffff; display: grid; place-items: center; font-weight: 600;
  transition: transform var(--duration) var(--easing); }
.demo:hover, .demo:focus-visible { transform: scale(var(--scale)); }
.controls { display: grid; grid-template-columns: max-content 1fr; gap: .75rem 1rem;
  align-items: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 1rem; margin-top: 1rem; }
.controls output { font-family: var(--mono); font-size: .875rem; }
.copy-prompt { margin-top: 1rem; }
.copy-prompt.ok { border-color: var(--ok); color: var(--ok); }
@media (prefers-reduced-motion: reduce) {
  .demo { transition: none; }
}
</style>
</head>
<body>
<!-- Bloque de procedencia — obligatorio; lo exige check-artifact.py.
     Rellena prompt, fecha (AAAA-MM-DD), familia y fuentes. No se renderiza
     y sobrevive a cualquier editor. Familias válidas: exploracion,
     explicador, informe, diagrama, prototipo, cuestionario, editor,
     presentacion. -->
<!-- procedencia: {"prompt": "", "fecha": "", "familia": "", "fuentes": []} -->
<header>
  <h1>ASUNTO DEL ARTEFACTO</h1>
  <p class="lead">Qué interacción se prueba y qué debe notarse, con la fecha.</p>
</header>
<main>

  <section id="prueba">
    <h2>Zona de prueba</h2>
    <div class="stage">
      <div class="demo" tabindex="0" id="demo">Pasa el ratón o enfoca</div>
    </div>
    <div class="controls">
      <label for="duration">Duración</label>
      <input type="range" id="duration" min="100" max="900" step="50" value="300">
      <label for="scale">Escala</label>
      <input type="range" id="scale" min="1" max="1.3" step="0.02" value="1.08">
      <span>Easing</span>
      <label><input type="checkbox" id="bounce" checked> Con rebote</label>
      <span></span>
      <output id="state" aria-live="polite"></output>
    </div>
    <p class="copy-prompt"><button type="button" id="copy-prompt">Copiar como prompt</button></p>
  </section>

  <section id="desconocidos">
    <h2>Desconocidos</h2>
    <p>Qué no se pudo verificar o qué falta para validar la interacción.</p>
  </section>

</main>
<script>
(function () {
  var stageDemo = document.getElementById("demo");
  var duration = document.getElementById("duration");
  var scale = document.getElementById("scale");
  var bounce = document.getElementById("bounce");
  var state = document.getElementById("state");

  function apply() {
    var easing = bounce.checked
      ? "cubic-bezier(0.34, 1.56, 0.64, 1)"
      : "cubic-bezier(0.2, 0, 0, 1)";
    stageDemo.style.setProperty("--duration", duration.value + "ms");
    stageDemo.style.setProperty("--scale", scale.value);
    stageDemo.style.setProperty("--easing", easing);
    state.textContent = "duración " + duration.value + "ms · escala " + scale.value
      + " · " + (bounce.checked ? "con rebote" : "sin rebote");
  }

  duration.addEventListener("input", apply);
  scale.addEventListener("input", apply);
  bounce.addEventListener("change", apply);
  apply();

  document.getElementById("copy-prompt").addEventListener("click", async function () {
    var text = "Ajusta la interacción: duración " + duration.value + "ms, escala "
      + scale.value + ", easing " + (bounce.checked
        ? "cubic-bezier(0.34, 1.56, 0.64, 1)" : "cubic-bezier(0.2, 0, 0, 1)") + ".";
    try {
      await navigator.clipboard.writeText(text);
      this.textContent = "Copiado";
      this.classList.add("ok");
      setTimeout(function (b) { b.textContent = "Copiar como prompt"; b.classList.remove("ok"); }, 1000, this);
    } catch (e) {
      this.textContent = "No se pudo copiar: copia el texto a mano";
    }
  });
})();
</script>
</body>
</html>
